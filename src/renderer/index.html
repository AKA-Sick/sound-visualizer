<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sound Visualizer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="menu-area">
    <button id="menu-btn">☰</button>
  </div>
  <div id="app">
    <div id="panel">
  <div class="panel-section">
    <h3>Visualization</h3>
    <button class="mode-btn active" data-mode="segmented-led">Segmented LED</button>
    <button class="mode-btn" data-mode="neon-glow">Neon Glow</button>
    <button class="mode-btn" data-mode="mirrored">Mirrored</button>
  </div>

  <div class="panel-section">
    <label>Source</label>
    <select id="source-select">
      <option value="live">Live System Audio</option>
      <option value="file">Audio File</option>
    </select>
  </div>

  <div class="panel-section" id="file-controls" hidden>
    <button id="load-file-btn">Load File…</button>
    <div id="file-progress" hidden>
      <span id="file-progress-label">Separating stems… 0%</span>
      <progress id="file-progress-bar" max="100" value="0"></progress>
    </div>
    <div id="file-transport" hidden>
      <button id="file-play-btn">Play</button>
      <button id="file-pause-btn">Pause</button>
      <input type="range" id="file-seek" min="0" max="100" step="0.1" value="0">
    </div>
    <div id="stem-mixer" hidden>
      <div class="stem-row" data-stem="vocals">
        <label>Vocals</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
      <div class="stem-row" data-stem="drums">
        <label>Drums</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
      <div class="stem-row" data-stem="bass">
        <label>Bass</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
      <div class="stem-row" data-stem="guitar">
        <label>Guitar</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
      <div class="stem-row" data-stem="piano">
        <label>Piano</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
      <div class="stem-row" data-stem="other">
        <label>Other</label>
        <input type="checkbox" class="stem-mute">
        <input type="range" class="stem-volume" min="0" max="1" step="0.01" value="1">
        <button class="stem-solo">Solo</button>
      </div>
    </div>
    <div id="cache-info">
      <span id="cache-size-label">Cache: 0 MB</span>
      <button id="clear-cache-btn">Clear Cache</button>
    </div>
  </div>

  <div class="panel-section">
    <h3>Color Theme</h3>
    <select id="theme-select">
      <option value="neon">Neon</option>
      <option value="ice">Ice</option>
      <option value="fire">Fire</option>
      <option value="monochrome">Monochrome</option>
    </select>
  </div>

  <div class="panel-section">
    <h3>Audio Mode</h3>
    <select id="audio-mode">
      <option value="normal">Normal</option>
      <option value="vocal-highlight">Vocal Highlight</option>
      <option value="mid-side">Mid/Side Split</option>
      <option value="ml-stems">ML Stems</option>
    </select>
  </div>

  <div class="panel-section">
    <h3>Sensitivity</h3>
    <div class="slider-group">
      <label><span>Master Gain</span><span id="sensitivity-val">1.0</span></label>
      <input type="range" id="sensitivity" min="0.1" max="10" step="0.1" value="1.0">
    </div>
    <div class="slider-group">
      <label><span>Vocal Gain</span><span id="vocal-gain-val">1.0</span></label>
      <input type="range" id="vocal-gain" min="0.1" max="10" step="0.1" value="1.0">
    </div>
  </div>

  <div class="panel-section">
    <h3>Bar Count</h3>
    <div class="slider-group">
      <label><span>Bars</span><span id="barcount-val">64</span></label>
      <input type="range" id="barcount" min="32" max="128" step="1" value="64">
    </div>
  </div>

  <div class="panel-section">
    <h3>Bar Size</h3>
    <div class="slider-group">
      <label><span>Size</span><span id="barsize-val">3</span></label>
      <input type="range" id="barsize" min="1" max="10" step="1" value="3">
    </div>
  </div>

  <div class="panel-section">
    <h3>Background</h3>
    <select id="bg-select">
      <option value="solid">Solid Dark</option>
      <option value="gradient">Gradient</option>
      <option value="transparent">Transparent</option>
    </select>
  </div>

  <div class="panel-section">
    <h3>Frequency Labels</h3>
    <div class="toggle">
      <span>Show</span>
      <input type="checkbox" id="freq-labels">
    </div>
  </div>

  <div class="panel-section">
    <h3>Beat Effect</h3>
    <select id="beat-effect">
      <option value="none">None</option>
      <option value="flash">Flash</option>
      <option value="bounce">Bar Bounce</option>
      <option value="colorshift">Color Shift</option>
      <option value="glow">Glow Pulse</option>
      <option value="scale">Scale Pulse</option>
      <option value="shake">Bass Shake</option>
      <option value="border">Border Pulse</option>
    </select>
  </div>
</div>
    <div id="canvas-container">
      <canvas id="visualizer"></canvas>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
